# lefthook — local Git hooks. Every hook calls a Pixi task so hooks and CI stay aligned.
min_version: "2.2.2"

pre-commit:
  parallel: true
  jobs:
    - name: rust-fmt
      glob: "*.rs"
      run: pixi run --frozen --no-install fmt
      stage_fixed: true

    - name: rust-clippy
      glob: ["*.rs", "**/Cargo.toml", "Cargo.lock"]
      run: pixi run --frozen --no-install clippy

    - name: python-lint
      glob: ["automation/**/*.py", "rude.toml"]
      run: pixi run --frozen --no-install lint-python && pixi run --frozen --no-install rude-clean && pixi run --frozen --no-install format-python-check && pixi run --frozen --no-install typecheck

    - name: gherkin
      glob: "**/*.feature"
      run: pixi run --frozen --no-install automation lint_gherkin

    - name: prose
      glob: ["*.md", "docs/**/*.md", "vale.toml", ".vale.ini", ".vale/**"]
      run: pixi run --frozen --no-install automation prose_check && pixi run --frozen --no-install automation lint_prose

    - name: docs-lint
      glob: ["*.md", "docs/**/*.md", "crates/*/README.md", ".markdownlint-cli2.jsonc"]
      run: pixi run --frozen --no-install docs-lint

    - name: alint
      run: pixi run --frozen --no-install alint

    - name: actionlint
      glob: ".github/workflows/*.{yml,yaml}"
      run: pixi run --frozen --no-install actionlint

    - name: sandbox-check
      glob: ["pixi-sandbox.toml", "scripts/restore.sh", ".github/workflows/*.yml"]
      run: pixi run --frozen --no-install sandbox-check

    - name: skills-check
      glob: [".agents/**", "automation/check_skills.py", "skills-lock.json"]
      run: pixi run --frozen --no-install automation skills_check

commit-msg:
  jobs:
    - name: convco
      run: pixi run --frozen --no-install lint-commit < {1}

pre-push:
  piped: true
  jobs:
    - name: audit
      run: pixi run --frozen --no-install automation audit_offline

    - name: deny
      run: pixi run --frozen --no-install deny-offline

    - name: tests
      run: pixi run --frozen --no-install test-all && pixi run --frozen --no-install test-automation
