name: probe-cargo-npm

# TEMPORARY. Answers one question: does `cargo install cargo-npm` touch a
# repository lockfile, and if so, which one and how?
#
# Deleted once the answer is recorded. Not part of the required check set.

on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]

permissions:
  contents: read

jobs:
  probe:
    name: Probe cargo install effect on lockfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.83.0
          cache: true
          frozen: true

      - name: Record baseline hashes
        run: |
          mkdir -p /tmp/probe
          sha256sum Cargo.lock pixi.lock > /tmp/probe/before.txt
          cat /tmp/probe/before.txt
          echo "--- workspace member manifests ---"
          find . -name Cargo.toml -not -path './target/*' -not -path './.git/*' | sort

      - name: cargo install cargo-npm
        shell: bash
        run: |
          set +e
          pixi run --frozen cargo install cargo-npm --version 0.1.4 --locked 2>&1 | tail -20
          echo "install_exit=${PIPESTATUS[0]}"
          command -v cargo-npm && cargo-npm --version || echo "cargo-npm not on PATH in this shell"

      - name: What changed in the repository
        shell: bash
        run: |
          echo "=== git status --porcelain ==="
          git status --porcelain
          echo "=== Cargo.lock diffstat ==="
          git diff --stat -- Cargo.lock
          echo "=== pixi.lock diffstat ==="
          git diff --stat -- pixi.lock
          echo "=== any untracked Cargo.lock anywhere ==="
          find . -name Cargo.lock -newer /tmp/probe/before.txt -not -path './.git/*' 2>/dev/null

      - name: Emit the patch
        shell: bash
        run: |
          git add -A -N >/dev/null 2>&1 || true
          git diff > /tmp/probe/change.patch
          echo "patch_bytes=$(wc -c < /tmp/probe/change.patch)"
          if [ -s /tmp/probe/change.patch ]; then
            python3 - <<'PY'
          import base64, pathlib
          raw = pathlib.Path('/tmp/probe/change.patch').read_bytes()
          b64 = base64.b64encode(raw).decode()
          print(f"::error title=PATCH_BYTES::{len(raw)}")
          for i in range(0, len(b64), 690):
              print(f"::error title=P{i//690}::{b64[i:i+690]}")
          PY
          else
            echo "::error title=PATCH_EMPTY::git diff produced 0 bytes"
          fi

      - name: Upload patch artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-npm-probe-patch
          path: /tmp/probe/change.patch
          if-no-files-found: warn
