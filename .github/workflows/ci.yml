name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Classify change scope
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.scope.outputs.docs-only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect documentation-only changes
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: python3 automation/change_scope.py

  documentation:
    name: Documentation and policy checks
    needs: changes
    if: ${{ needs.changes.outputs.docs-only == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.83.0
          cache: true
          frozen: true
      - name: Alint policy check
        run: pixi run --frozen alint
      - name: Repository invariants
        run: pixi run --frozen automation repo_check
      - name: Agent skills validation
        run: pixi run --frozen automation skills_check
      - name: Backlog status guard
        run: pixi run --frozen automation backlog_check
      - name: Prose rendering and Vale lint
        run: pixi run --frozen automation prose_check && pixi run --frozen automation lint_prose
      - name: Markdown formatting
        run: pixi run --frozen docs-lint
      - name: Markdown links
        run: pixi run --frozen check-links
      - name: Changelog check
        run: pixi run --frozen automation changelog_check

  quality:
    name: Repository, Rust, and Python quality
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.83.0
          cache: true
          frozen: true
      - name: Cache Cargo registry downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v1-
      - name: Select weekly advisory cache
        id: advisory-cache-key
        run: pixi run --frozen automation advisory_cache key
      - name: Cache advisory database clones
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/advisory-db
            ~/.cargo/advisory-dbs
          key: ${{ runner.os }}-rustsec-v1-${{ steps.advisory-cache-key.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-rustsec-v1-
      - name: Clean restored advisory clones
        run: pixi run --frozen automation advisory_cache clean
      - name: Alint policy check
        run: pixi run --frozen alint
      - name: Repository invariants
        run: pixi run --frozen automation repo_check
      - name: Version parity check
        run: pixi run --frozen automation bump_version --check
      - name: Agent skills validation
        run: pixi run --frozen automation skills_check
      - name: Backlog status guard
        run: pixi run --frozen automation backlog_check
      - name: Check advisory exception
        run: pixi run --frozen automation advisory_exception
      - name: Check Cargo package contents
        run: pixi run --frozen automation check_packages
      - name: Check Gherkin feature files
        run: pixi run --frozen automation lint_gherkin
      - name: Check Python automation lint, format, and types
        run: |
          pixi run --frozen lint-python
          pixi run --frozen format-python-check
          pixi run --frozen typecheck
      - name: Check Python Clean Code thresholds
        run: pixi run --frozen rude-clean
      - name: Check prose, markdownlint, links, and changelog
        run: |
          pixi run --frozen automation prose_check
          pixi run --frozen automation lint_prose
          pixi run --frozen docs-lint
          pixi run --frozen check-links
          pixi run --frozen automation changelog_check
      - name: Check sandbox parity
        run: pixi run --frozen sandbox-check
      - name: Lint GitHub Actions workflows
        run: pixi run --frozen actionlint
      - name: Lint TOML formatting
        run: pixi run --frozen lint-toml
      - name: Check Rust formatting and Clippy
        run: |
          pixi run --frozen fmt-check
          pixi run --frozen clippy
      - name: Check Cargo dependency policy and audit
        run: |
          pixi run --frozen deny
          pixi run --frozen audit

  coverage:
    name: Rust and Python BDD tests and coverage
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.83.0
          cache: true
          frozen: true
      - name: Cache Cargo registry downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v1-
      - name: Run Python automation BDD and unit tests with coverage
        run: pixi run --frozen test-automation-cov
      - name: TEMP coverage diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          out=$(pixi run --frozen coverage 2>&1); rc=$?
          echo "::error title=COV_RC::rc=${rc}"
          b64=$(printf '%s' "$out" | tail -c 1800 | base64 -w0)
          i=0
          while [ -n "$b64" ]; do
            echo "::error title=COV_${i}::${b64:0:600}"
            b64=${b64:600}
            i=$((i+1))
          done
          exit 0
      - name: Run Rust BDD coverage suite
        run: pixi run --frozen coverage
      - name: Run Rust doctests
        run: pixi run --frozen test-doc
      - name: Build standalone release binary
        run: pixi run --frozen build-release
      - name: Smoke-test standalone release binary
        run: target/release/gh-repoconf --version
      - name: Upload source coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  conda-package:
    name: Conda package build (rattler-build)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.83.0
          environments: packaging
          cache: true
          frozen: true
      - name: Build and test Conda package
        run: pixi run --frozen -e packaging package

  pypi-package:
    name: PyPI wheel and sdist build (maturin)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.83.0
          environments: pypi
          cache: true
          frozen: true
      - name: Cache Cargo registry downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v1-
      - name: Build PyPI wheel and sdist
        run: pixi run --frozen -e pypi package-pypi

  platforms:
    name: Supported platforms (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test workspace and doctests
        run: |
          cargo test --workspace --locked
          cargo test --workspace --doc --locked

  commit-messages:
    name: Conventional commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.83.0
          cache: true
          frozen: true
      - name: Check commits follow Conventional Commits
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: pixi run --frozen automation commit_range check
