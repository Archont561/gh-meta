name: diag

on:
  push:
    branches: ["arena/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: Diagnose clifacet failures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.83.0
          cache: true
          frozen: true
      - name: convco check detail
        continue-on-error: true
        run: |
          set +e
          pixi run --frozen automation commit_range check > /tmp/cc.log 2>&1; echo "convco exit=$?"
          i=0
          while IFS= read -r line; do
            i=$((i+1))
            printf '::error title=CONVCO line=%s::%s\n' "$i" "$(printf '%s' "$line" | cut -c1-900)"
          done <<< "$(grep -v '^$' /tmp/cc.log | tail -12)"
      - name: fmt and clippy detail
        continue-on-error: true
        run: |
          set +e
          pixi run --frozen fmt-check > /tmp/fmt.log 2>&1; echo "fmt exit=$?"
          i=0
          while IFS= read -r line; do
            i=$((i+1))
            printf '::error title=FMT line=%s::%s\n' "$i" "$(printf '%s' "$line" | cut -c1-900)"
          done <<< "$(grep -v '^$' /tmp/fmt.log | tail -30)"
          pixi run --frozen clippy > /tmp/clippy.log 2>&1; echo "clippy exit=$?"
          i=0
          while IFS= read -r line; do
            i=$((i+1))
            printf '::error title=CLIPPY line=%s::%s\n' "$i" "$(printf '%s' "$line" | cut -c1-900)"
          done <<< "$(grep -v '^$' /tmp/clippy.log | tail -40)"
      - name: nextest detail
        continue-on-error: true
        run: |
          set +e
          pixi run --frozen test > /tmp/test.log 2>&1; echo "nextest exit=$?"
          i=0
          while IFS= read -r line; do
            i=$((i+1))
            printf '::error title=NEXTEST line=%s::%s\n' "$i" "$(printf '%s' "$line" | cut -c1-900)"
          done <<< "$(grep -v '^$' /tmp/test.log | tail -40)"
      - name: doctest detail
        continue-on-error: true
        run: |
          set +e
          pixi run --frozen test-doc > /tmp/doc.log 2>&1; echo "doctest exit=$?"
          i=0
          while IFS= read -r line; do
            i=$((i+1))
            printf '::error title=DOCTEST line=%s::%s\n' "$i" "$(printf '%s' "$line" | cut -c1-900)"
          done <<< "$(grep -v '^$' /tmp/doc.log | tail -40)"
