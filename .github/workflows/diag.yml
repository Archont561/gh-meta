name: diag

on:
  push:
    branches: ["arena/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: Diagnose clifacet failures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.83.0
          cache: true
          frozen: true
      - name: run every gate and report exits plus error lines
        continue-on-error: true
        run: |
          set +e
          report() {
            name=$1; shift
            "$@" > "/tmp/$name.log" 2>&1
            code=$?
            printf '::error title=EXIT %s=%s::done\n' "$name" "$code"
            i=0
            while IFS= read -r line; do
              i=$((i+1))
              printf '::error title=%s line=%s::%s\n' "$name" "$i" "$(printf '%s' "$line" | cut -c1-900)"
            done <<< "$(grep -E 'error(\[|:)|^error|failures:|panicked|^\s+-->|FAILED|would reformat|assertion' "/tmp/$name.log" | head -25)"
          }
          report convco pixi run --frozen automation commit_range check
          report fmt pixi run --frozen fmt-check
          report clippy pixi run --frozen clippy
          report nextest pixi run --frozen test
          report coverage pixi run --frozen coverage
