name: Feature Request
description: Suggest an enhancement to gh-meta or its repository tooling
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        `gh-meta` is currently an early two-crate scaffold (`gh-meta-core` and
        `gh-meta`) with the `clifacet` command seam wired and no frontend enabled.
        Proposals should align with `backlog/docs/` and ADRs in
        `backlog/decisions/`.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What `.github/` or repository metadata gap does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the CLI, config, or workflow behavior expected.
    validations:
      required: true
  - type: dropdown
    id: willingness
    attributes:
      label: Would you like to work on this?
      options:
        - "Yes, I can submit a PR"
        - "I can test or review"
        - "No"
    validations:
      required: false
