# Dependabot v2 configuration.
# Covered ecosystems:
#   - cargo          — Cargo.toml + Cargo.lock
#   - bun            — package.json + bun.lock (developer CLIs)
#   - github-actions — SHA-pinned workflow actions
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    # Both files carry a "Generated by pixi-sandbox init" header and are rendered from
    # pixi-sandbox.toml. `automation repo_check` and the CI sandbox-check step compare them
    # against a fresh render, so any partial bump of the SHA pins inside them fails the pull
    # request. Their action versions come from the pixi-sandbox release instead.
    exclude-paths:
      - ".github/workflows/relock.yml"
      - ".github/workflows/publish-sandbox.yml"
