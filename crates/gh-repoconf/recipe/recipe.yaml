# Conda package recipe for the standalone gh-repoconf CLI binary.
schema_version: 1

context:
  version: "0.1.0"

package:
  name: gh-repoconf
  version: ${{ version }}

source:
  - path: ../../..
    filter:
      exclude:
        - ".pixi/**"
        - ".pixi-sandbox/**"
        - "target/**"
        - "output/**"
        - "dist/**"
        - "build/**"
        - "npm/**"
        - "node_modules/**"
        - ".git/**"
        - "coverage/**"
        - "**/*.conda"

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    content:
      - if: unix
        then:
          - cargo build --release --locked --package gh-repoconf
          - mkdir -p "$PREFIX/bin"
          - install -m 0755 target/release/gh-repoconf "$PREFIX/bin/gh-repoconf"
        else:
          - cargo build --release --locked --package gh-repoconf
          - if not exist "%LIBRARY_BIN%" mkdir "%LIBRARY_BIN%"
          - copy /Y "target\release\gh-repoconf.exe" "%LIBRARY_BIN%\gh-repoconf.exe"

requirements:
  build:
    - rust >=1.88,<2
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}

tests:
  - script:
      - gh-repoconf --version
      - gh-repoconf --help

about:
  summary: Your .github/ directory, managed as code
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/Archont561/gh-repoconf
  repository: https://github.com/Archont561/gh-repoconf
