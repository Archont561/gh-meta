[build-system]
requires = ["maturin>=1.16,<2.0"]
build-backend = "maturin"

[project]
name = "gh-repoconf"
requires-python = ">=3.9"
description = "Your .github/ directory, managed as code (standalone CLI and gh extension)"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Archont561" }]
keywords = ["github", "github-cli", "cli", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Rust",
  "Programming Language :: Python",
  "Topic :: Software Development :: Build Tools",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/Archont561/gh-repoconf"
Repository = "https://github.com/Archont561/gh-repoconf"
Issues = "https://github.com/Archont561/gh-repoconf/issues"

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
strip = true
locked = true
