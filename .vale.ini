# Generated by automation/prose.py from vale.toml. Edit vale.toml, not this file.

StylesPath = .vale/styles
MinAlertLevel = warning

Packages = https://github.com/vale-cli/Microsoft/releases/download/v0.15.1/Microsoft.zip, https://github.com/vale-cli/write-good/releases/download/v0.4.1/write-good.zip

Vocab = GhRepoconf

[*.md]
BasedOnStyles = Vale, Microsoft, write-good, GhRepoconf

Microsoft.Dashes = NO
#   Spaced em dashes keep terminal-width Markdown readable across 80-100 column editors.
Microsoft.Contractions = NO
#   Formal uncontracted English keeps specification prose unambiguous.
Microsoft.Semicolon = NO
#   Semicolons join closely paired clauses in reference tables and explanations.
Microsoft.We = NO
#   Guides have no first-person author voice.
Microsoft.Vocab = NO
#   Guides state observable behavior and architectural boundaries, not marketing copy.
Microsoft.Avoid = NO
#   Technical terms like backend and standalone are used in their standard engineering sense.
Microsoft.HeadingAcronyms = NO
#   Acronyms such as CLI, BDD, ADR, and CI are standard in section headings.
Microsoft.HeadingPunctuation = NO
#   Headings may use colons or question marks when introducing an explanation or procedure.
Microsoft.HeadingColons = NO
#   Headings may end in colons before structured lists or reference blocks.
Microsoft.Adverbs = NO
#   Words such as deliberately and explicitly mark intentional architectural refusals.
Microsoft.Terms = NO
#   Coding agents are named 'agents' consistently with AGENTS.md and skills tooling.
write-good.ThereIs = NO
#   Introductory sentences may open with 'There is' when listing repository invariants.
write-good.TooWordy = NO
#   Technical precision takes precedence over brevity alerts.
write-good.E-Prime = NO
#   Guides state what files and boundaries are.
write-good.Passive = NO
#   Technical prose states how tooling acts on manifests, builds, and packages.
write-good.Weasel = NO
#   Qualifiers express deliberate scope exceptions honestly.
Vale.Terms = NO
#   Tool names appear in both prose and command spans with deliberate case.

[backlog/**/*.md]
BasedOnStyles = Vale

[CHANGELOG.md]
BasedOnStyles = Vale
