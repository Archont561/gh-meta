# Authored sandbox policy. Workflows and scripts/restore.sh are generated from it.
schema = 1
branch_prefix = "sandbox"
cargo_vendor = true

[budgets]
max_blob_mib = 95
max_transport_mib = 2048
max_repository_push_mib = 2048
max_restore_required_mib = 8192

[[bundle]]
name = "developer"
environments = ["default"]
platforms = ["linux-64"]

[workflow]
push_paths = [
  "Cargo.lock",
  "Cargo.toml",
  "bun.lock",
  "package.json",
  "crates/**/Cargo.toml",
  "pixi-sandbox.toml",
  "pixi.lock",
  "pixi.toml",
]
relock_paths = [
  "Cargo.lock",
  "Cargo.toml",
  "bun.lock",
  "package.json",
  "crates/**/Cargo.toml",
  "pixi-sandbox.toml",
  "pixi.lock",
  "pixi.toml",
]
permissions = true
# The rendered release-sandbox workflows run this Pixi, and the generator also pins the relock
# guard's setup-pixi step to it while every other workflow uses v0.83.0. `pixi.toml` therefore
# keeps `requires-pixi` at a floor this release satisfies, so `pixi lock --check` passes there.
pixi_version = "v0.83.0"
setup_pixi_cache = false

[workflow.concurrency]
group = "publish-sandbox"
cancel_in_progress = false

[workflow.timeouts]
plan = 15
publish = 60
